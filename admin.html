<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админка | Полотно</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container { max-width: 800px; margin: 20px auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1em; box-sizing: border-box; }
    textarea { min-height: 80px; resize: vertical; }
    .btn { background: var(--accent-color); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 1em; margin-right: 10px; margin-top: 10px; }
    .btn:hover { background: #6d360f; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .product-list { margin-top: 30px; }
    .product-item { background: white; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
    .product-img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
    .product-info { flex: 1; }
    .delete-btn { background: #dc3545; padding: 8px 16px; font-size: 0.9em; }
    .delete-btn:hover { background: #a71d2a; }
  </style>
</head>
<body>
  <header>
    <h1>🔧 Админка Полотно</h1>
    <p>Управление меню</p>
  </header>

  <div class="admin-container">
    <h2>Добавить товар</h2>
    <form id="product-form">
      <div class="form-group">
        <label>Название</label>
        <input type="text" id="product-name" required>
      </div>
      <div class="form-group">
        <label>Описание</label>
        <textarea id="product-description" required></textarea>
      </div>
      <div class="form-group">
        <label>Цена (₽)</label>
        <input type="number" id="product-price" required>
      </div>
      <div class="form-group">
        <label>Категория</label>
        <select id="product-category">
          <option value="Пышки">Пышки</option>
          <option value="Напитки">Напитки</option>
          <option value="Другое">Другое</option>
        </select>
      </div>
      <div class="form-group">
        <label>Фотография товара</label>
        <input type="file" id="product-image" accept="image/*">
        <small style="color: #666;">Фото будет загружено на ImgBB</small>
      </div>
      <button type="submit" class="btn" id="submit-btn">Добавить товар</button>
      <a href="index.html" class="btn" style="text-decoration: none; display: inline-block; text-align: center;">← На главную</a>
    </form>

    <div class="product-list">
      <h2>Все товары</h2>
      <div id="products-container">Загрузка...</div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
