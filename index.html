<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Полотно | Пышка-бар</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#8B4513">
  <style>
    .product-img-main { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #eee; }
  </style>
</head>
<body>
  <header>
    <h1>🍩 Полотно</h1>
    <p>Пышки, крафт и настольные игры</p>
    <a href="admin.html" style="color: #ffd700; font-size: 0.8em; text-decoration: none;">(Админка)</a>
  </header>

  <main>
    <h2>Наше меню</h2>
    <div class="menu-grid" id="menu-grid">
      <p style="padding: 20px;">Загрузка меню...</p>
    </div>
  </main>

  <div id="cart-modal" class="cart-modal hidden">
    <h3>Ваш заказ</h3>
    <ul id="cart-items"></ul>
    <p>Итого: <span id="cart-total">0</span> ₽</p>
    <button id="checkout-btn" class="btn" style="width:100%; margin-top:10px;">Оформить заказ</button>
    <button id="close-cart" class="btn" style="width:100%; background:#666; margin-top:5px;">Закрыть</button>
  </div>
  
  <button id="cart-fab">🛒 <span id="cart-count">0</span></button>

  <script type="module" src="app.js"></script>
</body>
</html>
